[project]
name = "rl-basics"
version = "0.1.0"
description = "Reinforcement Learning basics"
authors = [
    {name = "asma.aliouche",email = "asma.aliouche@servier.com"}
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "gymnasium (>=1.3.0,<2.0.0)",
    "stable-baselines3 (>=2.9.0,<3.0.0)",
    "matplotlib (<3.11)",
    "jupyter (>=1.1.1,<2.0.0)",
    "ipykernel (>=7.3.0,<8.0.0)",
    "nbformat (>=5.11.1,<6.0.0)",
    "pygame (>=2.6.1,<3.0.0)",
    "torch (>=2.0.0)",
    "tensorboard (>=2.21.0,<3.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
